##############################################################
# nginx.dev.conf — Local development reverse proxy
# Routes /api and /ws to the dashboard container,
# /assets to LocalStack S3
##############################################################

events {
    worker_connections 1024;
}

http {
    upstream dashboard {
        server dashboard:3000;
    }

    upstream localstack_s3 {
        server localstack:4566;
    }

    server {
        listen 80;
        server_name localhost;

        # ─── Health check ─────────────────────────────────────
        location /health {
            proxy_pass http://dashboard/health;
            proxy_set_header Host $host;
        }

        # ─── WebSocket ────────────────────────────────────────
        location /ws {
            proxy_pass         http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ─── API ──────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://dashboard;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            client_max_body_size 50m;
        }

        # ─── Assets (LocalStack S3 mock) ─────────────────────
        location /assets/ {
            rewrite ^/assets/(.*)$ /realmforge-local-assets/$1 break;
            proxy_pass http://localstack_s3;
            proxy_set_header Host localstack;

            # Cache static assets locally
            proxy_cache_valid 200 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # ─── Default → dashboard ──────────────────────────────
        location / {
            proxy_pass http://dashboard;
            proxy_set_header Host $host;
        }
    }
}
