# docker/nginx/nginx.prod.conf
# Production nginx config — used inside Docker if not behind CloudFront
# If CloudFront is in front, this terminates TLS at CloudFront instead

events { worker_connections 4096; }

http {
    # ─── Global settings ──────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_min_length 1000;
    gzip_types      text/plain application/json application/javascript text/css;

    # ─── Rate limiting zones ───────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m     rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ─── Log format ────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream dashboard {
        least_conn;
        server dashboard:3000;
        keepalive 64;
    }

    # ─── HTTP → HTTPS redirect ────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS server ─────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name realmforge.gg www.realmforge.gg;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Security headers
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        client_max_body_size 50m;
        limit_conn conn 50;

        # ─── WebSocket ────────────────────────────────────────
        location /ws {
            proxy_pass          http://dashboard;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
            proxy_set_header    X-Real-IP  $remote_addr;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ─── Auth routes (stricter rate limit) ────────────────
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass         http://dashboard;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        # ─── API routes ───────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass         http://dashboard;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # ─── Health check (no rate limit) ─────────────────────
        location /health {
            proxy_pass http://dashboard/health;
            access_log off;
        }

        # ─── Static files served directly ─────────────────────
        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ─── Default → dashboard ──────────────────────────────
        location / {
            proxy_pass         http://dashboard;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}
