##############################################################
# .github/workflows/pr-checks.yml
# Runs on every pull request targeting main or dev.
# Enforces: lint, tests, Terraform validate, Docker build.
##############################################################

name: PR Checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:

  # ─── 1. Lint & Test Dashboard ────────────────────────────────
  test-dashboard:
    name: Dashboard — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       realmforge_test
          POSTGRES_USER:     realmforge
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test -- --forceExit --coverage
        env:
          NODE_ENV:     test
          DATABASE_URL: postgresql://realmforge:testpass@localhost:5432/realmforge_test
          REDIS_URL:    redis://localhost:6379
          JWT_SECRET:   pr-test-secret-not-for-production

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: dashboard/coverage/
          retention-days: 7

  # ─── 2. Docker Build Check ───────────────────────────────────
  docker-build-check:
    name: Docker — Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dashboard image (no push)
        uses: docker/build-push-action@v5
        with:
          context:    dashboard
          file:       docker/dashboard/Dockerfile
          push:       false
          tags:       realmforge-dashboard:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ─── 3. Terraform Validate ───────────────────────────────────
  terraform-validate:
    name: Terraform — Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.6'

      - name: Terraform Init (local backend for validation)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

  # ─── 4. Shell Script Lint ────────────────────────────────────
  shellcheck:
    name: Shell Scripts — Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          additional_files: 'server/RealmForgeServer.sh'

  # ─── Summary ─────────────────────────────────────────────────
  pr-summary:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [test-dashboard, docker-build-check, terraform-validate, shellcheck]
    if: always()

    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.test-dashboard.result }}"       != "success" ||
                "${{ needs.docker-build-check.result }}"   != "success" ||
                "${{ needs.terraform-validate.result }}"   != "success" ||
                "${{ needs.shellcheck.result }}"           != "success" ]]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All PR checks passed"
